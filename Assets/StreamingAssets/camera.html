<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Shipyard Surfers - kamera</title>
<style>
body {
    background: #191c20;
    color: #d9dde1;
    font: 15px/1.5 system-ui, 'Segoe UI', sans-serif;
    max-width: 1040px;
    margin: 32px auto;
    padding: 0 20px;
}
h1 { font-size: 19px; font-weight: 600; margin: 0; }
#status { font-size: 12px; color: #6d757d; }
a { color: #848c94; }
.label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #848c94;
    margin: 22px 0 6px;
}
#layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; margin-top: 20px; }
#view { flex: 1 1 560px; }
#feed {
    width: 100%;
    background: #0f1113;
    border: 1px solid #262b30;
    border-radius: 4px;
    display: block;
}
#side { flex: 0 0 300px; }
.kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #262b30; }
.kv span:last-child { font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; background: #262b30; color: #d9dde1; }
.badge.tracking { background: #1f4d2e; color: #9ee6b4; }
.badge.lost, .badge.nocamera { background: #5a2323; color: #f2a6a6; }
.badge.searching { background: #4d431f; color: #e6d59e; }
.arm { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #3a4047; margin-right: 6px; vertical-align: middle; }
.arm.on { background: #5ccc7a; }
#gesture {
    font-size: 34px;
    font-weight: 600;
    min-height: 44px;
    color: #4d545b;
    transition: color 0.15s ease;
}
#gesture.flash { color: #ffffff; }
#log { font-size: 13px; color: #848c94; }
#log div { padding: 3px 0; border-bottom: 1px solid #262b30; display: flex; justify-content: space-between; }
#hint { font-size: 13px; color: #b9a35a; min-height: 20px; }
</style>
</head>
<body>

<h1>Shipyard Surfers - podglad kamery</h1>
<div id="status">laczenie... &middot; <a href="/">wyniki</a></div>

<div id="layout">
    <div id="view">
        <canvas id="feed" width="640" height="480"></canvas>
        <div id="hint"></div>
    </div>
    <div id="side">
        <div class="label">Sledzenie</div>
        <div class="kv"><span>stan</span><span id="state" class="badge">-</span></div>
        <div class="kv"><span>osoba</span><span id="person">-</span></div>
        <div class="kv"><span>pozy / s</span><span id="fps">-</span></div>
        <div class="kv"><span>inferencja</span><span id="inf">-</span></div>
        <div class="kv"><span>kanal pion</span><span><i id="armV" class="arm"></i>skok / rolka</span></div>
        <div class="kv"><span>kanal poziom</span><span><i id="armH" class="arm"></i>lewo / prawo</span></div>

        <div class="label">Ostatni gest</div>
        <div id="gesture">-</div>

        <div class="label">Historia</div>
        <div id="log"></div>
    </div>
</div>

<script>
var SKELETON = [
    [5, 6], [5, 7], [7, 9], [6, 8], [8, 10], [5, 11], [6, 12], [11, 12],
    [11, 13], [13, 15], [12, 14], [14, 16], [0, 1], [0, 2], [1, 3], [2, 4], [3, 5], [4, 6]
];
var KEYPOINT_LABELS = { 7: 'L lokiec', 8: 'P lokiec', 9: 'L dlon', 10: 'P dlon' };
var GESTURE_NAMES = { Jump: 'SKOK', Roll: 'ROLKA', LaneLeft: 'LEWO', LaneRight: 'PRAWO' };
var MAX_LOG = 8;

var canvas = document.getElementById('feed');
var ctx = canvas.getContext('2d');
var frameImage = new Image();
var frameUrl = null;
var frameReady = false;
var pose = null;
var lastGestureTime = -1;
var dirty = false;

function onFrame(blob) {
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
        if (frameUrl) URL.revokeObjectURL(frameUrl);
        frameUrl = url;
        frameImage = img;
        frameReady = true;
        if (canvas.width !== img.width || canvas.height !== img.height) {
            canvas.width = img.width;
            canvas.height = img.height;
        }
        dirty = true;
    };
    img.src = url;
}

function onPose(text) {
    pose = JSON.parse(text);
    renderSide(pose);
    dirty = true;
}

function render() {
    requestAnimationFrame(render);
    if (!dirty) return;
    dirty = false;

    var w = canvas.width;
    var h = canvas.height;
    var mirror = pose ? pose.mirror : true;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0f1113';
    ctx.fillRect(0, 0, w, h);

    if (mirror) ctx.setTransform(-1, 0, 0, 1, w, 0);

    if (frameReady) {
        ctx.drawImage(frameImage, 0, 0, w, h);
    } else {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#4d545b';
        ctx.font = '16px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('brak obrazu z kamery', w / 2, h / 2);
        ctx.textAlign = 'left';
        if (mirror) ctx.setTransform(-1, 0, 0, 1, w, 0);
    }

    if (pose && pose.hasPerson) drawPose(pose, w, h, mirror);
}

function px(v, size) { return v * size; }

function drawPose(p, w, h, mirror) {
    var k = p.kpts;

    ctx.lineWidth = 2;
    ctx.strokeStyle = p.poseValid ? 'rgba(92, 204, 122, 0.9)' : 'rgba(180, 180, 180, 0.6)';
    for (var s = 0; s < SKELETON.length; s++) {
        var a = SKELETON[s][0] * 3;
        var b = SKELETON[s][1] * 3;
        if (k[a + 2] < 0.4 || k[b + 2] < 0.4) continue;
        ctx.beginPath();
        ctx.moveTo(px(k[a], w), px(k[a + 1], h));
        ctx.lineTo(px(k[b], w), px(k[b + 1], h));
        ctx.stroke();
    }

    for (var i = 0; i < 17; i++) {
        var c = k[i * 3 + 2];
        if (c < 0.2) continue;
        var r = (i === 9 || i === 10) ? 7 : 4;
        ctx.beginPath();
        ctx.arc(px(k[i * 3], w), px(k[i * 3 + 1], h), r, 0, Math.PI * 2);
        ctx.fillStyle = confidenceColor(c);
        ctx.fill();
    }

    var bx = px(p.bbox[0], w), by = px(p.bbox[1], h), bw = px(p.bbox[2], w), bh = px(p.bbox[3], h);
    ctx.strokeStyle = 'rgba(255, 196, 64, 0.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = '13px system-ui, sans-serif';
    var label = 'person ' + p.personConfidence.toFixed(2);
    var labelX = mirror ? w - bx - bw : bx;
    var labelY = Math.max(16, by - 6);
    var tw = ctx.measureText(label).width + 10;
    ctx.fillStyle = 'rgba(255, 196, 64, 0.9)';
    ctx.fillRect(labelX, labelY - 14, tw, 18);
    ctx.fillStyle = '#191c20';
    ctx.fillText(label, labelX + 5, labelY);

    ctx.font = '11px system-ui, sans-serif';
    for (var key in KEYPOINT_LABELS) {
        var idx = parseInt(key, 10) * 3;
        if (k[idx + 2] < 0.4) continue;
        var x = px(k[idx], w);
        if (mirror) x = w - x;
        var y = px(k[idx + 1], h);
        ctx.fillStyle = 'rgba(25, 28, 32, 0.75)';
        var text = KEYPOINT_LABELS[key];
        ctx.fillRect(x + 8, y - 8, ctx.measureText(text).width + 8, 15);
        ctx.fillStyle = '#d9dde1';
        ctx.fillText(text, x + 12, y + 3);
    }
    if (mirror) ctx.setTransform(-1, 0, 0, 1, w, 0);
}

function confidenceColor(c) {
    var t = Math.max(0, Math.min(1, (c - 0.3) / 0.6));
    var r = Math.round(230 - 150 * t);
    var g = Math.round(90 + 130 * t);
    return 'rgb(' + r + ',' + g + ',70)';
}

function renderSide(p) {
    var state = document.getElementById('state');
    state.textContent = p.state;
    state.className = 'badge ' + p.state.toLowerCase();

    document.getElementById('person').textContent = p.hasPerson ? (p.personConfidence.toFixed(2) + (p.poseValid ? '' : ' (niepelna)')) : 'brak';
    document.getElementById('fps').textContent = p.poseFps.toFixed(1);
    document.getElementById('inf').textContent = p.inferenceMs.toFixed(1) + ' ms';
    document.getElementById('armV').className = 'arm' + (p.armedVertical ? ' on' : '');
    document.getElementById('armH').className = 'arm' + (p.armedHorizontal ? ' on' : '');

    var hint = '';
    if (p.state === 'Tracking' && (!p.armedVertical || !p.armedHorizontal)) {
        hint = 'Pozycja gotowosci: dlonie na klatce piersiowej. Skok: obie dlonie do wysokosci barkow. Rolka: obie dlonie w dol ponizej lokci. Skret: przedramie w bok (lewe w lewo, prawe w prawo).';
    } else if (p.state === 'Searching') {
        hint = 'Stan przed kamera tak, aby widoczne byly barki, dlonie i biodra.';
    }
    document.getElementById('hint').textContent = hint;

    if (p.lastGestureTime >= 0 && p.lastGestureTime !== lastGestureTime) {
        lastGestureTime = p.lastGestureTime;
        showGesture(p.lastGesture, p.lastGestureTime);
    }
}

function showGesture(name, time) {
    var el = document.getElementById('gesture');
    el.textContent = GESTURE_NAMES[name] || name;
    el.className = 'flash';
    setTimeout(function () { el.className = ''; }, 400);

    var log = document.getElementById('log');
    var row = document.createElement('div');
    var n = document.createElement('span');
    n.textContent = GESTURE_NAMES[name] || name;
    var t = document.createElement('span');
    t.textContent = time.toFixed(2) + ' s';
    row.appendChild(n); row.appendChild(t);
    log.insertBefore(row, log.firstChild);
    while (log.childNodes.length > MAX_LOG) log.removeChild(log.lastChild);
}

function setStatus(connected) {
    document.getElementById('status').firstChild.textContent =
        connected ? 'polaczono · ' : 'brak polaczenia - ponawianie... · ';
}

function connect() {
    var ws = new WebSocket('ws://' + location.hostname + ':8081/camera');
    ws.binaryType = 'blob';
    ws.onopen = function () { setStatus(true); };
    ws.onmessage = function (e) {
        if (typeof e.data === 'string') onPose(e.data);
        else onFrame(e.data);
    };
    ws.onclose = function () { setStatus(false); setTimeout(connect, 1000); };
}

connect();
render();
</script>
</body>
</html>
